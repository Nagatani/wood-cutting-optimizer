name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown --features wasm -- -D warnings
      - run: cargo test

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - name: Build TypeScript
        working-directory: packages/typescript
        run: npm ci && npm run build
      - name: Build Rust CLI
        working-directory: packages/rust
        run: cargo build --release
      - name: Install wasm-bindgen CLI (same version as Cargo.lock)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"$' packages/rust/Cargo.lock | grep version | cut -d'"' -f2)
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz" | tar xz
          echo "$PWD/wasm-bindgen-$V-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build WebAssembly (Node.js bindings)
        working-directory: packages/rust
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown --features wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/wood_cutting_optimizer.wasm --out-dir pkg-node --target nodejs
      - name: Compare TypeScript, Python, Rust and WebAssembly outputs
        run: python scripts/check_parity.py --require-all
      - name: Validate test cases and outputs against schema.json
        run: |
          python -m pip install jsonschema
          python scripts/validate_schema.py
