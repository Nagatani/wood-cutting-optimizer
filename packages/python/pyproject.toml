[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wood-cutting-optimizer"
version = "0.2.0"
description = "Zero-dependency 1D and 2D wood cutting optimization core library"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "wood-cutting-optimizer contributors" }
]
requires-python = ">=3.9"
keywords = ["woodworking", "cutting-stock", "bin-packing", "guillotine-cut", "optimizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nagatani/wood-cutting-optimizer"
Repository = "https://github.com/Nagatani/wood-cutting-optimizer"
Issues = "https://github.com/Nagatani/wood-cutting-optimizer/issues"
Changelog = "https://github.com/Nagatani/wood-cutting-optimizer/blob/main/CHANGELOG.md"

[project.scripts]
wood-cutting-optimizer = "wood_cutting_optimizer.cli:main"
wood-opt = "wood_cutting_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wood_cutting_optimizer*"]

[tool.setuptools.package-data]
wood_cutting_optimizer = ["py.typed"]
